<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness CORS Helper</title><link rel="stylesheet" href="popup.css">
<main><h1>CORS 助手</h1><p id="page" class="muted"></p>
<p id="status" role="status" aria-live="polite">正在读取当前页面…</p><p id="next-step"></p>
<p id="error" role="alert" hidden></p>
<button id="enable" disabled>启动</button>
<output id="detected-url" hidden></output>
<p id="hint" class="muted">自动读取公开的 API 地址，不读取页面中的密钥。</p>
<details id="manual"><summary>修改 API 地址</summary><label for="endpoint">完整 API 请求 URL</label><input id="endpoint" type="url" placeholder="https://api.deepseek.com/chat/completions" autocomplete="off"><p>仅在未识别地址时填写。启动后需先停止才能更换地址。不要填写密钥。</p></details>
<details><summary>权限与限制</summary><p id="mode-note"></p>
<p>调试器权限较强，可能接收匹配请求的认证头等元数据。本实现不记录或保存密钥、正文和回复，不改变真实 POST 的状态或内容。仅用于可信的 Harness 页面。</p>
<p>扩展没有测试接口是否连通。真实鉴权、额度、TLS 和网络错误不能修复。网页保持「直连」。不支持 file://；浏览器重启后需重新启动。</p>
</details></main><script type="module" src="popup.js"></script></html>
