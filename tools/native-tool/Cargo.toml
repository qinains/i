[package]
name = "i-native-tool"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
glob = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
unicode-width = "0.2"
base64 = "0.23"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
