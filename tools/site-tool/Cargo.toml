[package]
name = "i-site-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
url = "2"
flate2 = "1"
crc32fast = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

