[package]
name = "i"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A plugin-first Rust coding agent for native terminals and browser WASM"
license = "MIT"
default-run = "i"
repository = "https://github.com/qinains/i"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "i"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "i-package"
path = "src/bin/package.rs"
required-features = ["packaging"]

[[bin]]
name = "i-completions"
path = "src/bin/completions.rs"
required-features = ["native"]

[[bench]]
name = "benchmarks"
harness = false
required-features = ["native"]

[[bench]]
name = "performance"
harness = false
required-features = ["native"]

[dependencies]
anyhow = "1"
base64 = "0.23"
url = "2"
serde_json = "1"
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
globset = { version = "0.4", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
i-wasm-protocol = { path = "plugins/wasm-protocol", optional = true }


# Packaging dependencies (optional)
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http = { version = "1", optional = true }
httpdate = { version = "1", optional = true }
tracing = "0.1"
i-plugins = { path = "plugins/runtime", optional = true }
command-group = { version = "5", optional = true }
dunce = "1"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4.5", optional = true }
rustyline = { version = "17", optional = true }
dirs-next = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"

[dev-dependencies]
criterion = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["native"]
native = ["dep:sha2", "dep:http", "dep:httpdate", "dep:i-plugins", "dep:command-group", "dep:clap", "dep:clap_complete", "dep:rustyline", "dep:dirs-next", "dep:reqwest", "dep:rustls"]
bundled = ["native"]
packaging = ["native", "dep:tar", "dep:flate2", "zip/deflate"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:i-wasm-protocol"]

[workspace]
members = ["plugins/runtime", "plugins/wasm-protocol", "plugins/wasm-package", "plugins/wasm-sdk"]
default-members = ["."]
exclude = ["examples/rust-plugin", "examples/wasm-word-count", "examples/wasm-json-format", "vendor/globset"]
resolver = "2"

# Upstream Rust sources unchanged; narrow globset's regex backend features only.
[patch.crates-io]
globset = { path = "vendor/globset" }

# Optional distribution profile; keeps all tools/plugins, trades build time for size.
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
