[package]
name = "i-wasm-package"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "i-plugin-pack"
path = "src/bin/pack.rs"
required-features = ["cli"]

[features]
default = []
cli = []
web = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
anyhow = "1"
i-wasm-protocol = { path = "../wasm-protocol" }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmparser = { version = "=0.240.0", default-features = false, features = ["std", "validate", "features"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
wat = "=1.240.0"
tempfile = "3"
