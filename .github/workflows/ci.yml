name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Build Rust development tools and protocol fixtures
        shell: bash
        run: |
          for manifest in tools/*/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
            cargo build --locked --manifest-path "$manifest" --target-dir target
          done
      - run: cargo run --locked --manifest-path tools/repo-tool/Cargo.toml --target-dir target -- check-globset
      - run: cargo run --locked --manifest-path tools/repo-tool/Cargo.toml --target-dir target -- check-no-python
      - run: cargo run --locked --manifest-path tools/site-tool/Cargo.toml --target-dir target -- translations --check
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/rust-plugin/Cargo.toml --check
      - name: Install Linux native TLS build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ca-certificates
      - run: cargo clippy --workspace --locked --all-targets --features bundled -- -D warnings
      - run: cargo build --workspace --locked --features bundled
      - run: cargo fetch --locked
      - run: cargo run --locked --manifest-path tools/repo-tool/Cargo.toml --target-dir target -- licenses --check
      - name: Test Rust development tooling
        shell: bash
        run: |
          for manifest in tools/*/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --locked --manifest-path "$manifest" --target-dir target --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest" --target-dir target
          done
      - run: cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-connections
      - name: Report the installable debug executable size
        shell: bash
        run: cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- binary-size "target/debug/i${{ runner.os == 'Windows' && '.exe' || '' }}"
      - run: cargo test --workspace --locked --features bundled
      - run: cargo test --locked -p i-wasm-package --features cli
      - run: cargo check --locked --no-default-features -p i
      - name: Verify interactive editor with a pseudo-terminal
        if: runner.os != 'Windows'
        run: cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-console target/debug/i
      - name: Verify hidden setup input and terminal restoration
        if: runner.os != 'Windows'
        run: cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-setup target/debug/i
      - name: Verify native TLS rejection offline
        if: runner.os != 'Windows'
        run: cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-tls target/debug/i --web
      - run: cargo test --locked --manifest-path examples/rust-plugin/Cargo.toml --target-dir target
      - name: Build complete min-size packages in both formats
        run: cargo run --locked --features bundled,packaging --bin i-package -- --profile min-size
      - name: Verify first-run installation without changing the runner user
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-first-run "$PWD/target/$host/min-size/i"
      - name: Verify native packages offline
        shell: bash
        run: |
          for archive in dist/*.tar.gz dist/*.tar.xz dist/*.zip; do
            if [ -f "$archive" ]; then cargo run --locked --manifest-path tools/native-tool/Cargo.toml --target-dir target -- check-package "$archive"; fi
          done
      - name: Retain verified Windows package for VM smoke testing
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 3
