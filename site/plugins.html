<section class="plugin-directory" aria-labelledby="plugins-title">
  <h1 id="plugins-title" data-site-i18n="plugins.title">插件目录</h1>
  <section id="native-plugins" aria-labelledby="native-plugins-title">
    <h2 id="native-plugins-title" data-site-i18n="plugins.native.title">原生 CLI 插件</h2>
    <div class="plugin-grid">
      <article class="plugin-card">
        <h3 data-site-i18n="plugins.verification.title">验收证据</h3>
        <code>verify_project_check</code>
        <p data-site-i18n="plugins.verification.detail">在本机用 Playwright 验证会话恢复与未发送内容导出，并保留测试报告。需要 i CLI 和可信源码工作区，不支持在浏览器工作台中导入。</p>
        <a href="/docs/plugin-development/#示例-用验收证据核对浏览器会话恢复" data-site-i18n="plugins.verification.guide">查看 CLI 使用说明 →</a>
      </article>
    </div>
  </section>
  <section id="browser-plugins" aria-labelledby="browser-plugins-title">
    <h2 id="browser-plugins-title" data-site-i18n="plugins.browser.title">浏览器工作台插件</h2>
    <p data-site-i18n="plugins.intro">浏览社区插件，在工作台中检查插件包后决定是否安装。安装和授权始终由你确认。</p>
    <p class="muted" data-site-i18n="plugins.disclaimer">收录不代表授予权限，也不代表验证发布者身份。</p>
    <nav class="plugin-actions" aria-label="插件" data-site-i18n-aria="plugins.browser.title">
      <a class="button" href="/app/?settings=plugins" data-site-i18n="nav.open">打开工作台</a>
      <a href="https://github.com/qinains/i-plugins" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-site-i18n="plugins.submit">提交插件</a>
      <a href="/docs/plugin-publishing/" data-site-i18n="plugins.development">发布指南</a>
    </nav>
    <button id="plugins-load" type="button" data-site-i18n="plugins.load">加载目录</button>
    <p id="plugins-status" role="status" aria-live="polite"></p>
    <div id="plugins-list" class="plugin-grid"></div>
  </section>
</section>
